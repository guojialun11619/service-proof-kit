name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Bedrock audit tests
        run: python -m unittest discover -s bedrock-audit -p 'test_*.py' -v
      - name: Run CSV cleanup tests
        run: python -m unittest discover -s csv-cleanup -p 'test_*.py' -v
